<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="author" content="IRCLASS" />
    <meta name="description" content="IRS Key Learnings register (G14): every project's key learnings, by date originated" />
    <meta name="version" content="0.1.0" />
    <meta name="autoRefresh" content="0" />
    <title>IRS Key Learnings</title>

    <link rel="stylesheet" type="text/css" href="../JazzySole/bootstrap/css/bootstrap.min.css" />
    <!-- tabulator_simple, NOT bootstrap5: the bootstrap5 theme renders at 16px,
         about twice the row height of the OOTB grids beside us. Same choice as
         IRSProjects and IRSTasks. -->
    <link rel="stylesheet" type="text/css" href="../JazzySole/Tabulator/css/tabulator_simple.min.css" />
    <link rel="stylesheet" type="text/css" href="../JazzySole/Notify/Notify.css" />
    <!-- the widget's only custom CSS, all under .irs-learnings (rule R1) -->
    <link rel="stylesheet" type="text/css" href="css/IRSKeyLearnings.css" />

    <widget:preferences>
        <widget:preference type="hidden" name="x3dPlatformId" defaultValue="OnPremise"></widget:preference>
        <!-- NO preference for the range or the search text: every reload
             starts clean (user, 2026-10-25 - overrides rule R6 here) -->
    </widget:preferences>

    <!-- shared libraries. Tabulator's JS is NOT a script tag: its UMD bundle
         would call an anonymous define() and break the AMD loader. -->
    <script type="text/javascript" src="../JazzySole/PlatformService/Credentials.js"></script>
    <script type="text/javascript" src="../JazzySole/PlatformService/Request.js"></script>
    <script type="text/javascript" src="../JazzySole/Notify/Notify.js"></script>
    <script type="text/javascript" src="../JazzySole/Tabulator/TabulatorLoader.js"></script>
    <script type="text/javascript" src="../JazzySole/Ui/Format.js"></script>
    <script type="text/javascript" src="../JazzySole/Ui/CredentialBar.js"></script>

    <!-- widget modules: one AMD module per file (rule R4) -->
    <script type="text/javascript" src="js/config/LearningFields.js"></script>
    <script type="text/javascript" src="js/services/IndexSearch.js"></script>
    <script type="text/javascript" src="js/services/LearningService.js"></script>
    <script type="text/javascript" src="js/components/LearningToolbar.js"></script>
    <script type="text/javascript" src="js/views/LearningColumns.js"></script>
    <script type="text/javascript" src="js/views/LearningListView.js"></script>
    <script type="text/javascript" src="js/App.js"></script>

    <!-- UWA events only: no logic here -->
    <script type="text/javascript">
    //<![CDATA[
        widget.addEvents({
            onLoad: function () {
                require(['IRSKeyLearnings/App'], function (App) { App.onLoad(); });
            },
            onRefresh: function () {
                require(['IRSKeyLearnings/App'], function (App) { App.onRefresh(); });
            },
            onResize: function () {
                require(['IRSKeyLearnings/App'], function (App) { App.onResize(); });
            }
        });
    //]]>
    </script>
</head>
<body>
    <div class="d-flex justify-content-center align-items-center p-5">
        <div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading</span></div>
    </div>
</body>
</html>
