spring.application.name=irclass-external-widget

# HTTPS
# 3DDashboard loads widgets over HTTPS only (WP03 open item O1): the dashboard
# page is HTTPS, so an HTTP widget is blocked as mixed content, and the
# dashboard also fetches the widget HTML server-side from the platform VM.
#
# Port 443 so the URL registered in 3DDashboard needs no port:
#   https://external.solize.com/WidgetPacket/IRSProjects/IRSProjects.html
#
# The keystore lives OUTSIDE this repository (default ~/.irs-certs) and its
# password is read from the environment variable WIDGET_KEYSTORE_PASSWORD.
# Neither the key nor the password is ever committed. Override the location
# with WIDGET_KEYSTORE if the keystore sits elsewhere.
# Certificate and keystore: see worklog entry 2026-09-24-01.
server.port=443
server.ssl.enabled=true
server.ssl.key-store=${WIDGET_KEYSTORE:file:${user.home}/.irs-certs/external-widget.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${WIDGET_KEYSTORE_PASSWORD}
server.ssl.key-alias=external-widget
